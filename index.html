<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Man Standing</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Premier League themed CSS variables */
        :root {
            --background: 0 0% 100%; /* White */
            --foreground: 222.2 84% 4.9%; /* Dark Gray */
            --card: 0 0% 100%;
            --card-foreground: 222.2 84% 4.9%;
            --popover: 0 0% 100%;
            --popover-foreground: 222.2 84% 4.9%;
            /* Premier League Purple */
            --primary: 297 100% 12%; /* hsl(297, 100%, 12%) approx #38003c */
            --primary-foreground: 0 0% 100%; /* White for contrast */
            --secondary: 210 40% 96.1%; /* Lighter Gray */
            --secondary-foreground: 222.2 47.4% 11.2%; /* Darker Gray */
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%; /* Medium Gray */
            --accent: 210 40% 96.1%;
            --accent-foreground: 222.2 47.4% 11.2%;
            --destructive: 0 84.2% 60.2%; /* Red */
            --destructive-foreground: 210 40% 98%; /* White */
            --border: 214.3 31.8% 91.4%; /* Light Gray Border */
            --input: 214.3 31.8% 91.4%;
            --ring: 297 100% 12%; /* Use PL Purple for focus rings */
            --radius: 0.5rem;
            /* Added Accent Green */
            --accent-green: 145 63% 42%; /* hsl(145, 63%, 42%) approx #27ae60 */
            --accent-green-foreground: 0 0% 100%; /* White */
            /* Added Success Color for messages */
            --success: 145 63% 42%; /* Using accent green */
            --success-foreground: 0 0% 100%; /* White */
             /* Added Info Color for messages */
            --info: 200 100% 40%; /* Blue for info */
            --info-foreground: 0 0% 100%; /* White */
        }
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: 'Inter', sans-serif;
        }
        /* Component-specific styles */
        .bg-secondary\/50 { background-color: hsla(var(--secondary), 0.5); }
        .bg-green-100 { background-color: #dcfce7; }
        .text-green-800 { color: #166534; }
        .bg-red-100 { background-color: #fee2e2; }
        .text-red-800 { color: #991b1b; }
        .bg-destructive\/10 { background-color: hsla(var(--destructive), 0.1); }
        .text-destructive { color: hsl(var(--destructive)); }
        .border-destructive { border-color: hsl(var(--destructive)); }
        /* Success message style */
        .bg-success\/10 { background-color: hsla(var(--success), 0.1); }
        .text-success { color: hsl(var(--success)); }
        .border-success { border-color: hsl(var(--success)); }
         /* Info message style */
        .bg-info\/10 { background-color: hsla(var(--info), 0.1); }
        .text-info { color: hsl(var(--info)); }
        .border-info { border-color: hsl(var(--info)); }


        /* Ensure focus rings are visible */
         button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid hsl(var(--ring));
            outline-offset: 2px;
        }
        /* Style for payment toggle button */
        .payment-toggle {
            padding: 0.1rem 0.4rem; font-size: 0.75rem; line-height: 1;
            min-width: 40px; height: auto; /* Removed margin-left */
        }
        /* Style for edit/delete buttons */
        .action-button {
             padding: 0.1rem 0.4rem; font-size: 0.75rem; line-height: 1; height: auto; /* Removed margin-left */
        }
         /* Style for edit input */
        .edit-input {
            height: 1.75rem; /* h-7 */
            padding: 0.25rem 0.5rem; /* px-2 py-1 */
            font-size: 0.875rem; /* text-sm */
            margin-left: 0.5rem; /* ml-2 */
            flex-grow: 1; /* Allow input to grow */
            border: 1px solid hsl(var(--input)); /* Add border */
            border-radius: 0.25rem; /* rounded-sm */
        }
        /* Style for edit select (fixture) */
        .edit-select {
             height: 1.75rem; padding: 0.1rem 0.5rem; font-size: 0.875rem;
             border: 1px solid hsl(var(--input)); border-radius: 0.25rem;
        }
        /* Style for team pick buttons */
        .team-pick-button {
            padding: 0.25rem 0.75rem; /* py-1 px-3 */
            height: auto; /* Adjust height */
            flex-grow: 1; /* Allow buttons to grow */
            text-align: center;
        }

        /* Tab button styling */
        .tab-button {
            padding: 0.5rem 1rem; border-radius: 0.375rem; /* rounded-md */
            border: 1px solid transparent; transition: background-color 0.2s, border-color 0.2s, color 0.2s, filter 0.2s; /* Added filter transition */
            cursor: pointer;
        }
        .tab-button-active {
             background-color: hsl(var(--primary));
             color: hsl(var(--primary-foreground));
        }
        .tab-button-inactive {
            background-color: hsl(var(--secondary));
            color: hsl(var(--secondary-foreground));
            border-color: hsl(var(--border));
        }
         .tab-button-inactive:hover {
             background-color: hsl(var(--muted));
         }
         /* Subtle background for card headers */
         .card-header-themed {
             background-color: hsl(var(--primary) / 0.05); /* Very light purple wash */
             border-bottom: 1px solid hsl(var(--border));
         }
         /* Textarea styling */
         textarea {
             border: 1px solid hsl(var(--input));
             border-radius: 0.375rem; /* rounded-md */
             padding: 0.5rem 0.75rem; /* p-2 px-3 */
             font-size: 0.875rem; /* text-sm */
         }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">

        // Destructure React hooks
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        // --- Local Storage Keys (Version Bump) ---
        const ACTIVE_GAME_STORAGE_KEY = 'lastManStandingState_v2';
        const MASTER_PARTICIPANTS_KEY = 'lastManStandingMasterParticipants_v1';

        // --- UI Components ---
        const Button = ({ onClick, children, variant = 'default', className = '', ...props }) => ( <button onClick={onClick} className={`inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(var(--ring))] focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-10 px-4 py-2 ${ variant === 'destructive' ? 'bg-[hsl(var(--destructive))] text-[hsl(var(--destructive-foreground))] hover:brightness-90' : variant === 'outline' ? 'border border-[hsl(var(--input))] bg-transparent hover:bg-[hsl(var(--accent))] hover:text-[hsl(var(--accent-foreground))]' : variant === 'secondary' ? 'bg-[hsl(var(--secondary))] text-[hsl(var(--secondary-foreground))] hover:bg-[hsl(var(--secondary))/0.8]' : variant === 'ghost' ? 'hover:bg-[hsl(var(--accent))] hover:text-[hsl(var(--accent-foreground))]' : variant === 'success' ? 'bg-[hsl(var(--accent-green))] text-[hsl(var(--accent-green-foreground))] hover:brightness-90' : 'bg-[hsl(var(--primary))] text-[hsl(var(--primary-foreground))] hover:brightness-90' } ${className}`} {...props}> {children} </button> );
        const Input = ({ className = '', type = 'text', ...props }) => ( <input type={type} className={`flex h-10 w-full rounded-md border border-[hsl(var(--input))] bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-[hsl(var(--muted-foreground))] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(var(--ring))] focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 ${className}`} {...props} /> );
        const Textarea = ({ className = '', ...props }) => ( <textarea className={`w-full min-h-[80px] rounded-md border border-[hsl(var(--input))] bg-transparent px-3 py-2 text-sm placeholder:text-[hsl(var(--muted-foreground))] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(var(--ring))] focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 ${className}`} {...props} /> );
        const Card = ({ children, className = '' }) => ( <div className={`rounded-xl border border-[hsl(var(--border))] bg-[hsl(var(--card))] text-[hsl(var(--card-foreground))] shadow ${className}`}> {children} </div> );
        const CardHeader = ({ children, className = 'card-header-themed' }) => ( <div className={`flex flex-col space-y-1.5 p-6 ${className}`}> {children} </div> );
        const CardTitle = ({ children, className = '' }) => ( <h3 className={`font-semibold leading-none tracking-tight ${className}`}> {children} </h3> );
        const CardDescription = ({ children, className = '' }) => ( <p className={`text-sm text-[hsl(var(--muted-foreground))] ${className}`}> {children} </p> );
        const CardContent = ({ children, className = '' }) => ( <div className={`p-6 pt-0 ${className}`}> {children} </div> );
        const CardFooter = ({ children, className = '' }) => ( <div className={`flex items-center p-6 pt-0 ${className}`}> {children} </div> );
        const Select = ({ children, className = '', ...props }) => ( <select className={`flex h-10 w-full items-center justify-between rounded-md border border-[hsl(var(--input))] bg-transparent px-3 py-2 text-sm ring-offset-background placeholder:text-[hsl(var(--muted-foreground))] focus:outline-none focus:ring-2 focus:ring-[hsl(var(--ring))] focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 ${className}`} {...props}> {children} </select> );
        const Label = ({ children, className = '', ...props }) => ( <label className={`block text-sm font-medium leading-none text-gray-700 peer-disabled:cursor-not-allowed peer-disabled:opacity-70 ${className}`} {...props}> {children} </label> );

        // --- Helper Functions ---
        const generateId = () => `id_${Math.random().toString(36).substr(2, 9)}`;

        // --- Constants ---
        const PREMIER_LEAGUE_TEAMS = [ "Arsenal", "Aston Villa", "Bournemouth", "Brentford", "Brighton & Hove Albion", "Chelsea", "Crystal Palace", "Everton", "Fulham", "Ipswich Town", "Leicester City", "Liverpool", "Manchester City", "Manchester United", "Newcastle United", "Nottingham Forest", "Southampton", "Tottenham Hotspur", "West Ham United", "Wolverhampton Wanderers" ].sort();
        const PREMIER_LEAGUE_LOGO_URL = "https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg";
        const teamNameMap = { 'arsenal': 'Arsenal', 'aston villa': 'Aston Villa', 'villa': 'Aston Villa', 'bournemouth': 'Bournemouth', 'brentford': 'Brentford', 'brighton': 'Brighton & Hove Albion', 'brighton & hove albion': 'Brighton & Hove Albion', 'chelsea': 'Chelsea', 'crystal palace': 'Crystal Palace', 'palace': 'Crystal Palace', 'everton': 'Everton', 'fulham': 'Fulham', 'ipswich': 'Ipswich Town', 'ipswich town': 'Ipswich Town', 'leicester': 'Leicester City', 'leicester city': 'Leicester City', 'liverpool': 'Liverpool', 'manchester city': 'Manchester City', 'man city': 'Manchester City', 'mancity': 'Manchester City', 'city': 'Manchester City', 'manchester united': 'Manchester United', 'man utd': 'Manchester United', 'man united': 'Manchester United', 'man u': 'Manchester United', 'united': 'Manchester United', 'newcastle': 'Newcastle United', 'newcastle united': 'Newcastle United', 'nottingham forest': 'Nottingham Forest', 'forest': 'Nottingham Forest', 'nottm forest': 'Nottingham Forest', 'nott\'m forest': 'Nottingham Forest', 'southampton': 'Southampton', 'saints': 'Southampton', 'tottenham hotspur': 'Tottenham Hotspur', 'tottenham': 'Tottenham Hotspur', 'spurs': 'Tottenham Hotspur', 'west ham united': 'West Ham United', 'west ham': 'West Ham United', 'wolverhampton wanderers': 'Wolverhampton Wanderers', 'wolves': 'Wolverhampton Wanderers' };

        // --- Load/Save Master Participant List ---
        const loadMasterParticipants = () => { try { const saved = localStorage.getItem(MASTER_PARTICIPANTS_KEY); if (saved) { const p = JSON.parse(saved); if (Array.isArray(p)) { return p.map(i => ({ id: i.id||generateId(), name: i.name||"?", hasPaid: i.hasPaid===true })); } } } catch (e) { console.error("Err load master P:", e); } return []; };
        const saveMasterParticipants = (p) => { try { localStorage.setItem(MASTER_PARTICIPANTS_KEY, JSON.stringify(p)); } catch (e) { console.error("Err save master P:", e); } };

        // --- Calculate Initial State ---
        const getInitialAppState = () => { const masterList = loadMasterParticipants(); let activeState = null; try { const saved = localStorage.getItem(ACTIVE_GAME_STORAGE_KEY); if (saved) { activeState = JSON.parse(saved); } } catch (e) { console.error("Err load ACTIVE state:", e); localStorage.removeItem(ACTIVE_GAME_STORAGE_KEY); } const needsFreshInit = !activeState || !activeState.participants || !activeState.fixtures || !activeState.currentWeek || (activeState.picks && Object.values(activeState.picks).some(pick => pick && typeof pick.prediction !== 'undefined')); if (!needsFreshInit) { console.log("Loading ACTIVE state (v2)."); const syncedPs = activeState.participants.map(ap => { const mp = masterList.find(m => m.id === ap.id); return { ...ap, hasPaid: mp ? mp.hasPaid : false, pickedTeams: ap.pickedTeams || [], picks: ap.picks || [] }; }); return { participants: syncedPs, fixtures: (activeState.fixtures || []).map(f => ({...f, result: f.result || null, plWeek: f.plWeek || 1 })), currentWeek: activeState.currentWeek || 1, gameStatus: activeState.gameStatus || 'setup', picks: activeState.picks || {}, winner: activeState.winner || null }; } console.log("Initializing fresh state (or incompatible version found)."); const initialPs = masterList.map(mp => ({ id: mp.id, name: mp.name, hasPaid: mp.hasPaid, isEliminated: false, pickedTeams: [], picks: [] })); return { participants: initialPs, fixtures: [], currentWeek: 1, gameStatus: 'setup', picks: {}, winner: null }; };

        // --- Helper function to generate unique short names ---
        const generateShortNames = (participants) => { const shortNames = {}; if (!participants || participants.length === 0) { return shortNames; } const nameData = participants.map(p => { const parts = p.name.split(' ').filter(Boolean); const firstName = parts[0] || ''; const lastName = parts.length > 1 ? parts.slice(1).join(' ') : ''; return { id: p.id, fullName: p.name, firstName: firstName, lastName: lastName, initialAbbr: lastName ? `${firstName} ${lastName.charAt(0)}.` : firstName }; }); const abbrCounts = nameData.reduce((counts, p) => { counts[p.initialAbbr] = (counts[p.initialAbbr] || 0) + 1; return counts; }, {}); const finalAbbrMap = {}; nameData.forEach(p => { if (abbrCounts[p.initialAbbr] > 1 && p.lastName) { let currentAbbr = p.initialAbbr; let unique = false; for (let i = 2; i <= p.lastName.length; i++) { currentAbbr = `${p.firstName} ${p.lastName.substring(0, i)}.`; if (!finalAbbrMap[currentAbbr]) { shortNames[p.id] = currentAbbr; finalAbbrMap[currentAbbr] = true; unique = true; break; } } if (!unique) { shortNames[p.id] = p.fullName; finalAbbrMap[p.fullName] = true; } } else { shortNames[p.id] = p.initialAbbr; finalAbbrMap[p.initialAbbr] = true; } }); return shortNames; };


        // --- Main App Component ---
        function App() {
          // --- State Variables ---
          const [masterParticipants, setMasterParticipants] = useState(() => loadMasterParticipants());
          const [initialAppState] = useState(() => getInitialAppState());
          const [participants, setParticipants] = useState(initialAppState.participants);
          const [fixtures, setFixtures] = useState(initialAppState.fixtures);
          const [currentWeek, setCurrentWeek] = useState(initialAppState.currentWeek);
          const [gameStatus, setGameStatus] = useState(initialAppState.gameStatus);
          const [picks, setPicks] = useState(initialAppState.picks);
          const [winner, setWinner] = useState(initialAppState.winner);
          const [newParticipantName, setNewParticipantName] = useState('');
          const [selectedHomeTeam, setSelectedHomeTeam] = useState('');
          const [selectedAwayTeam, setSelectedAwayTeam] = useState('');
          const [newFixturePLWeek, setNewFixturePLWeek] = useState(initialAppState.currentWeek);
          const [error, setError] = useState('');
          const [successMessage, setSuccessMessage] = useState('');
          const [activeTab, setActiveTab] = useState('participants');
          const [editingParticipantId, setEditingParticipantId] = useState(null);
          const [editedParticipantName, setEditedParticipantName] = useState('');
          const [editingFixtureId, setEditingFixtureId] = useState(null);
          const [editedFixtureData, setEditedFixtureData] = useState({ homeTeam: '', awayTeam: '', plWeek: '' });
          const [bulkFixturesText, setBulkFixturesText] = useState('');
          const fileInputRef = useRef(null);


           // --- Effect to Save ACTIVE GAME State ---
           useEffect(() => { try { const stateToSave = { participants: participants.map(({ id, name, isEliminated, pickedTeams, picks }) => ({ id, name, isEliminated, pickedTeams, picks })), fixtures, currentWeek, gameStatus, picks: picks, winner: winner }; localStorage.setItem(ACTIVE_GAME_STORAGE_KEY, JSON.stringify(stateToSave)); } catch (err) { console.error("Err save active state:", err); setError("Warn: Could not save."); } }, [participants, fixtures, currentWeek, gameStatus, picks, winner]);
           // Effect to update default PL week input when LMS week changes
           useEffect(() => { setNewFixturePLWeek(currentWeek); }, [currentWeek]);

          // --- Memoized Values ---
          const currentLMSWeekFixtures = useMemo(() => fixtures.filter(f => f.week === currentWeek), [fixtures, currentWeek]);
          const activeParticipants = useMemo(() => participants.filter(p => !p.isEliminated && p.hasPaid), [participants]);
          const eliminatedParticipants = useMemo(() => participants.filter(p => p.isEliminated), [participants]);
          const notPlayingParticipants = useMemo(() => participants.filter(p => !p.hasPaid && !p.isEliminated), [participants]);
          const availableHomeTeams = useMemo(() => PREMIER_LEAGUE_TEAMS.filter(team => team !== selectedAwayTeam), [selectedAwayTeam]);
          const availableAwayTeams = useMemo(() => PREMIER_LEAGUE_TEAMS.filter(team => team !== selectedHomeTeam), [selectedHomeTeam]);
          const editAvailableHomeTeams = useMemo(() => PREMIER_LEAGUE_TEAMS.filter(team => team !== editedFixtureData.awayTeam), [editedFixtureData.awayTeam]);
          const editAvailableAwayTeams = useMemo(() => PREMIER_LEAGUE_TEAMS.filter(team => team !== editedFixtureData.homeTeam), [editedFixtureData.homeTeam]);
          const shortNameMap = useMemo(() => generateShortNames(participants), [participants]);


          // --- Helper to clear messages ---
          const clearMessages = () => { setError(''); setSuccessMessage(''); }

          // --- Event Handlers ---
          const handleAddParticipant = () => { clearMessages(); const name = newParticipantName.trim(); if (name === '') { setError('Name empty.'); return; } if (masterParticipants.some(p => p.name.toLowerCase() === name.toLowerCase())) { setError(`"${name}" exists.`); return; } const newId = generateId(); const newMasterP = { id: newId, name: name, hasPaid: false }; const updatedMasterList = [...masterParticipants, newMasterP]; setMasterParticipants(updatedMasterList); saveMasterParticipants(updatedMasterList); if (gameStatus === 'setup') { setParticipants(prev => [...prev, { ...newMasterP, isEliminated: false, pickedTeams: [], picks: [] }]); } setNewParticipantName(''); setSuccessMessage(`Participant "${name}" added.`); };
          const handleParticipantInputKeyDown = (event) => { if (event.key === 'Enter') { event.preventDefault(); handleAddParticipant(); } };
          const handleRemoveParticipant = (idToRemove) => { clearMessages(); if (gameStatus !== 'setup') { setError("Cannot remove after setup."); return; } const participantToRemove = masterParticipants.find(p => p.id === idToRemove); if (!participantToRemove) return; if (window.confirm(`Are you sure you want to permanently remove ${participantToRemove.name}?`)) { const updatedMasterList = masterParticipants.filter(p => p.id !== idToRemove); setMasterParticipants(updatedMasterList); saveMasterParticipants(updatedMasterList); setParticipants(prev => prev.filter(p => p.id !== idToRemove)); setPicks(prevPicks => { const newPicks = {...prevPicks}; delete newPicks[idToRemove]; return newPicks; }); setSuccessMessage(`"${participantToRemove.name}" removed.`); } };
          const handleTogglePaidStatus = (idToToggle) => { clearMessages(); let pName = ''; const updatedMasterList = masterParticipants.map(p => { if (p.id === idToToggle) { pName = p.name; return { ...p, hasPaid: !p.hasPaid }; } return p; }); setMasterParticipants(updatedMasterList); saveMasterParticipants(updatedMasterList); setParticipants(prev => prev.map(p => p.id === idToToggle ? { ...p, hasPaid: !p.hasPaid } : p )); setSuccessMessage(`${pName}'s payment updated.`); };

          // --- Participant Edit Handlers ---
          const handleEditParticipant = (participant) => { clearMessages(); setEditingFixtureId(null); setEditingParticipantId(participant.id); setEditedParticipantName(participant.name); };
          const handleCancelEdit = () => { setEditingParticipantId(null); setEditedParticipantName(''); clearMessages(); };
          const handleSaveEdit = () => { clearMessages(); const newName = editedParticipantName.trim(); if (newName === '') { setError("Name cannot be empty."); return; } if (masterParticipants.some(p => p.id !== editingParticipantId && p.name.toLowerCase() === newName.toLowerCase())) { setError(`Name "${newName}" already exists.`); return; } const updatedMasterList = masterParticipants.map(p => p.id === editingParticipantId ? { ...p, name: newName } : p ); setMasterParticipants(updatedMasterList); saveMasterParticipants(updatedMasterList); setParticipants(prev => prev.map(p => p.id === editingParticipantId ? { ...p, name: newName } : p )); setSuccessMessage(`Participant name updated to "${newName}".`); setEditingParticipantId(null); setEditedParticipantName(''); };
          const handleEditInputKeyDown = (event) => { if (event.key === 'Enter') { handleSaveEdit(); } else if (event.key === 'Escape') { handleCancelEdit(); } };

          // --- Fixture Edit Handlers ---
          const handleEditFixture = (fixture) => { clearMessages(); setEditingParticipantId(null); setEditingFixtureId(fixture.id); setEditedFixtureData({ homeTeam: fixture.homeTeam, awayTeam: fixture.awayTeam, plWeek: fixture.plWeek }); };
          const handleCancelFixtureEdit = () => { setEditingFixtureId(null); setEditedFixtureData({ homeTeam: '', awayTeam: '', plWeek: '' }); clearMessages(); };
          const handleSaveFixtureEdit = () => { clearMessages(); const { homeTeam, awayTeam, plWeek } = editedFixtureData; const plWeekNum = parseInt(plWeek, 10); if (!homeTeam || !awayTeam) { setError("Please select both teams."); return; } if (homeTeam === awayTeam) { setError("Home and away teams cannot be the same."); return; } if (isNaN(plWeekNum) || plWeekNum <= 0) { setError("Invalid PL week number."); return; } const fixtureBeingEdited = fixtures.find(f => f.id === editingFixtureId); if (!fixtureBeingEdited) return; const currentLMSWeek = fixtureBeingEdited.week; const duplicateExists = fixtures.some(f => f.id !== editingFixtureId && f.week === currentLMSWeek && f.homeTeam === homeTeam && f.awayTeam === awayTeam ); if (duplicateExists) { setError(`Fixture ${homeTeam} vs ${awayTeam} already exists in LMS week ${currentLMSWeek}.`); return; } setFixtures(prev => prev.map(f => f.id === editingFixtureId ? { ...f, homeTeam, awayTeam, plWeek: plWeekNum } : f )); setSuccessMessage("Fixture updated successfully."); setEditingFixtureId(null); setEditedFixtureData({ homeTeam: '', awayTeam: '', plWeek: '' }); };
          const handleFixtureEditDataChange = (field, value) => { setEditedFixtureData(prev => ({ ...prev, [field]: value })); };

          // --- Fixture Handlers ---
          const handleAddFixture = () => { clearMessages(); const plWeekNum = parseInt(newFixturePLWeek, 10); if (!selectedHomeTeam || !selectedAwayTeam) { setError('Select teams.'); return; } if (isNaN(plWeekNum) || plWeekNum <= 0) { setError('Invalid PL week.'); return; } if (selectedHomeTeam === selectedAwayTeam) { setError('Teams same.'); return; } const exists = currentLMSWeekFixtures.some(f => f.homeTeam === selectedHomeTeam && f.awayTeam === selectedAwayTeam); if (exists) { setError(`Fixture exists LMS ${currentWeek}.`); return; } setFixtures(prev => [...prev, { id: generateId(), week: currentWeek, plWeek: plWeekNum, homeTeam: selectedHomeTeam, awayTeam: selectedAwayTeam, result: null },]); setSuccessMessage(`Fixture ${selectedHomeTeam} vs ${selectedAwayTeam} added.`); setSelectedHomeTeam(''); setSelectedAwayTeam(''); };
          const handleRemoveFixture = (idToRemove) => { clearMessages(); let removedFixStr = ''; setFixtures(prev => { const fixToRemove = prev.find(f => f.id === idToRemove); if (fixToRemove) { removedFixStr = `${fixToRemove.homeTeam} v ${fixToRemove.awayTeam}`; } return prev.filter(f => f.id !== idToRemove); }); setPicks(prevPicks => { const newPicks = {...prevPicks}; Object.keys(newPicks).forEach(pId => { if (newPicks[pId]?.fixtureId === idToRemove) { delete newPicks[pId]; } }); return newPicks; }); if(removedFixStr) setSuccessMessage(`Fixture ${removedFixStr} removed.`); if (editingFixtureId === idToRemove) { handleCancelFixtureEdit(); } };

                                            onChange={(e) => {
                                                // When fixture changes, clear the picked team for that user
                                                setPicks(prev => ({...prev, [p.id]: { fixtureId: e.target.value, pickedTeamName: undefined }}));
                                                clearMessages(); // Clear any previous errors
                                            }}
                                            className="flex-grow w-full sm:w-auto"
                                          >
                                            <option value="" disabled>Select Fixture</option>
                                            {currentLMSWeekFixtures.map(f => (
                                                // Filter based on used teams
                                                ( !p.pickedTeams.includes(f.homeTeam) || !p.pickedTeams.includes(f.awayTeam) ) ? // Show if at least one team is available
                                                <option key={f.id} value={f.id}> {f.homeTeam} v {f.awayTeam} (PL {f.plWeek}) </option> : null
                                            ))}
                                          </Select>
                                        </div>
                                        {/* Team Selection Buttons (Show only after fixture selected) */}
                                        {selectedFixture && (
                                            <div className="mt-2 pt-2 border-t flex flex-col sm:flex-row gap-2 items-center justify-center">
                                                <span className="text-sm mr-2">Pick winner:</span>
                                                <Button
                                                    variant={currentPick?.pickedTeamName === selectedFixture.homeTeam ? 'success' : 'outline'}
                                                    className="team-pick-button w-full sm:w-auto"
                                                    onClick={() => handleMakePick(p.id, selectedFixture.id, selectedFixture.homeTeam)}
                                                    disabled={p.pickedTeams.includes(selectedFixture.homeTeam)}
                                                    title={p.pickedTeams.includes(selectedFixture.homeTeam) ? `Already used ${selectedFixture.homeTeam}` : `Pick ${selectedFixture.homeTeam}`}
                                                >
                                                    {selectedFixture.homeTeam} {p.pickedTeams.includes(selectedFixture.homeTeam) ? '(Used)' : ''}
                                                </Button>
                                                 <span className="text-sm mx-1 font-semibold">OR</span>
                                                <Button
                                                    variant={currentPick?.pickedTeamName === selectedFixture.awayTeam ? 'success' : 'outline'}
                                                    className="team-pick-button w-full sm:w-auto"
                                                    onClick={() => handleMakePick(p.id, selectedFixture.id, selectedFixture.awayTeam)}
                                                    disabled={p.pickedTeams.includes(selectedFixture.awayTeam)}
                                                    title={p.pickedTeams.includes(selectedFixture.awayTeam) ? `Already used ${selectedFixture.awayTeam}` : `Pick ${selectedFixture.awayTeam}`}
                                                >
                                                    {selectedFixture.awayTeam} {p.pickedTeams.includes(selectedFixture.awayTeam) ? '(Used)' : ''}
                                                </Button>
                                            </div>
                                        )}
                                      </div> );
                                  })}
                                </div> )}
                              {gameStatus === 'results' && ( /* Results UI */ <div className="space-y-4"> <h4 className="font-medium">Enter Results LMS {currentWeek}:</h4> {currentLMSWeekFixtures.length === 0 && <p className="text-[hsl(var(--muted-foreground))]">No fixtures.</p>} {currentLMSWeekFixtures.map(f => { return ( <div key={f.id} className="flex flex-col sm:flex-row justify-between items-center p-2 rounded bg-gray-100 gap-2"> <span className="text-sm text-center sm:text-left flex-grow">{f.homeTeam} v {f.awayTeam} <span className="text-[hsl(var(--muted-foreground))]">(PL {f.plWeek})</span></span> <Select value={f.result || ''} onChange={(e) => handleSetResult(f.id, e.target.value)} className="w-full sm:w-auto"> <option value="" disabled>Result</option> <option value="H">Home Win</option> <option value="D">Draw</option> <option value="A">Away Win</option> </Select> </div> ); })} </div> )} </CardContent>
                             <CardFooter className="justify-center">
                                {gameStatus === 'picking' && ( <Button variant="success" onClick={handleEnterResultsPhase} title={"Confirm all picks are made"}> Confirm Picks </Button> )}
                                {gameStatus === 'results' && ( <Button variant="success" onClick={handleProcessResults} title={"Process entered results"}> Process Results </Button> )}
                             </CardFooter>
                          </Card>
                      </section>
                  )}
                  {activeTab === 'standings' && ( /* Standings Tab */ <section> {gameStatus === 'finished' && ( <Card className="mb-6 text-center"> <CardHeader> <CardTitle className="text-2xl">{winner ? `🎉 Winner: ${winner.name} 🎉` : 'Game Over!'}</CardTitle> </CardHeader> <CardContent> {winner ? `Congratulations!` : (error || 'Everyone eliminated.')} <p className="mt-2 text-sm text-[hsl(var(--muted-foreground))]">Total LMS weeks: {winner || error ? currentWeek : currentWeek -1}</p> </CardContent> <CardFooter className="justify-center"> <Button onClick={handleNewGame}>Start New Game</Button> </CardFooter> </Card> )} <Card> <CardHeader className="card-header-themed"> <CardTitle>Current Standings</CardTitle> <CardDescription>Status after LMS {currentWeek -1}.</CardDescription> </CardHeader> <CardContent> <h4 className="font-medium mb-2">Active ({activeParticipants.length})</h4> {activeParticipants.length > 0 ? ( <ul className="space-y-2"> {activeParticipants.map(p => ( <li key={p.id} className="p-2 rounded bg-green-100 text-green-800 text-sm"> {shortNameMap[p.id] || p.name} </li> ))} </ul> ) : ( <p className="text-[hsl(var(--muted-foreground))] text-sm italic"> {gameStatus === 'setup' && currentWeek === 1 ? 'Waiting...' : 'None'} </p> )} {eliminatedParticipants.length > 0 && ( <> <h4 className="font-medium mt-4 pt-4 border-t border-gray-200 mb-2">Eliminated ({eliminatedParticipants.length})</h4> <ul className="space-y-2 mt-2"> {eliminatedParticipants.map(p => ( <li key={p.id} className="p-2 rounded bg-red-100 text-red-800 line-through text-sm"> {shortNameMap[p.id] || p.name} </li> ))} </ul> </> )} {notPlayingParticipants.length > 0 && ( <> <h4 className="font-medium mt-4 pt-4 border-t border-gray-200 mb-2">Not Playing ({notPlayingParticipants.length})</h4> <ul className="space-y-2 mt-2"> {notPlayingParticipants.map(p => ( <li key={p.id} className="p-2 rounded bg-gray-100 text-gray-500 text-sm"> {shortNameMap[p.id] || p.name} (Not Paid) </li> ))} </ul> </> )} </CardContent> </Card> </section> )}
              </div>
            </div> );
        }

        // Render the App component into the 'root' div, with error catching
        try { ReactDOM.render(<App />, document.getElementById('root')); }
        catch (error) { console.error("React failed to render:", error); const rootDiv = document.getElementById('root'); if (rootDiv) { rootDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: red;"><h2>App Error</h2><p>Check console (F12).</p></div>'; } }

    </script>
</body>
</html>
